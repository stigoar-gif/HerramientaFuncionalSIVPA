  <circle cx="125" cy="110" r="10" fill="#eab308" opacity="0.9" />
  <circle cx="100" cy="95" r="10" fill="#eab308" opacity="0.9" />
  <circle cx="60" cy="125" r="8" fill="#ca8a04" opacity="0.9" />
  <circle cx="140" cy="125" r="8" fill="#ca8a04" opacity="0.9" />
  <circle cx="85" cy="140" r="8" fill="#eab308" opacity="0.9" />
  <circle cx="115" cy="140" r="8" fill="#ca8a04" opacity="0.9" />
  <!-- Texto -->
