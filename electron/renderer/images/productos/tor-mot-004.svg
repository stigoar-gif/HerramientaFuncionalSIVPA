<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="tortillaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="200" height="200" fill="#fff7ed" rx="20" />
  <!-- Tortillas apiladas -->
  <ellipse cx="100" cy="140" rx="60" ry="20" fill="url(#tortillaGrad)" stroke="#b45309" stroke-width="3" />
  <ellipse cx="100" cy="125" rx="55" ry="18" fill="url(#tortillaGrad)" stroke="#b45309" stroke-width="3" opacity="0.9" />
  <ellipse cx="100" cy="110" rx="50" ry="16" fill="url(#tortillaGrad)" stroke="#b45309" stroke-width="3" opacity="0.8" />
  <!-- Texto -->
  <text x="100" y="175" font-family="Arial" font-size="14" fill="#92400e" text-anchor="middle">Tortillas de Mote</text>
</svg>
