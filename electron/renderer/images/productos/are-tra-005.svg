<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="arepaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="200" height="200" fill="#fffbeb" rx="20" />
  <!-- Arepa tradicional -->
  <ellipse cx="100" cy="130" rx="55" ry="35" fill="url(#arepaGrad)" stroke="#b45309" stroke-width="3" />
  <!-- Maíz trillado (puntos) -->
  <circle cx="80" cy="100" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="120" cy="100" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="100" cy="85" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="65" cy="115" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="135" cy="115" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="85" cy="130" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="115" cy="130" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="75" cy="145" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="125" cy="145" r="4" fill="#d97706" opacity="0.8" />
  <!-- Texto -->
  <text x="100" y="175" font-family="Arial" font-size="14" fill="#92400e" text-anchor="middle">Arepa Tradicional</text>
</svg>
